name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build extension zip
        run: |
          sudo apt-get install -y --no-install-recommends libglib2.0-bin zip
          glib-compile-schemas --strict schemas
          zip -r stage-manager@local.shell-extension.zip \
            metadata.json extension.js stageManager.js sidebar.js prefs.js \
            stylesheet.css schemas LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" stage-manager@local.shell-extension.zip \
            --title "Stage Manager $GITHUB_REF_NAME" --generate-notes
